name: GitHub Metrics
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: poliglots
          config_timezone: UTC
          output_file: metrics.svg
          template: landscape

          # Plugins
          plugins.users.enabled: yes
          plugins.achievements.enabled: yes
          plugins.achievements.themes: tech, gaming, productivity
          plugins.sponsor.enabled: no
          plugins.support.enabled: no
          plugins.habits.enabled: yes
          plugins.habits.facts.enabled: yes
          plugins.infrastructure.used.services.enabled: no
          plugins.infrastructure.used.platforms.enabled: no

          # Base configuration
          base:
            divider: true
            background: 00000000
            padding: 25px
            header:
              title: poliglots
              icon: true
            location:
              country: true

          # Activity
          activity:
            enabled: yes
            limit: 5
            title: Recent Activity

          # Achievements
          achievements:
            enabled: yes
            title: Achievements
            density: 5
            layout: compact

          # Repositories
          repositories:
            enabled: yes
            title: Repositories
            layout: compact
            model: recently_updated
            stargazers: true
            forks: true
            size: true

          # Languages
          languages:
            enabled: yes
            title: Languages
            limit: 8
            detailed: yes
            icons: yes

          # Open Source
          open_source:
            enabled: yes
            title: Open Source Contributions

          # Following
          following:
            enabled: yes
            title: Following
            limit: 8

          footer: false
          gists: false
