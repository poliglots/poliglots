name: Update README Stats

on:
  create:
  push:
  schedule:
    # Run every 6 hours
    - cron: '21 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gather and update stats
        run: |
          chmod +x .github/scripts/update-stats.sh
          bash .github/scripts/update-stats.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_AUTHOR_NAME: "GitHub Actions"
          COMMIT_AUTHOR_EMAIL: "actions@github.com"

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Update README statistics [skip ci]"
            git push
          fi
