name: Update Open Source Contributions

on:
  create:
  push:
  schedule:
    - cron: "21 */6 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and update PRs
        run: |
          node .github/scripts/fetch-prs.js poliglots
          node .github/scripts/update-readme.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_AUTHOR_NAME: "GitHub Actions"
          COMMIT_AUTHOR_EMAIL: "actions@github.com"
          PR_BRANCH: "main"
